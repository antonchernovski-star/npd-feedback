<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Заглушка для старого адреса antonchernovski-star.github.io/npd-feedback/ после переезда.
     Заменяет index.html в репозитории npd-feedback ТОЛЬКО после проверки нового домена.
     Остальные файлы (privacy.html, feedback.html, docs/) можно оставить — ссылки из старых писем
     продолжат работать; при желании заменить их такими же заглушками. -->
<title>Навигатор по долгам переехал</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="3;url=https://app.navigatorpodolgam.ru/">
<link rel="canonical" href="https://app.navigatorpodolgam.ru/">
<style>
  body{margin:0;background:#F7F5F3;color:#2F2F2F;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;font-size:17px;line-height:1.55}
  main{max-width:620px;margin:60px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #e7e1da;border-radius:14px;padding:28px;box-shadow:0 2px 14px rgba(60,40,20,.06)}
  h1{font-size:24px;margin:0 0 10px;font-weight:600}
  a.btn{display:inline-block;margin-top:14px;background:#C96A3B;color:#fff;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:12px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Сервис переехал на новый адрес</h1>
    <p>Через несколько секунд вы окажетесь на app.navigatorpodolgam.ru. Если переход не произошёл — нажмите кнопку.</p>
    <a class="btn" href="https://app.navigatorpodolgam.ru/">Перейти к диагностике</a>
    <p style="font-size:14px;color:#6E6E6E;margin-top:18px">Результат, сохранённый в этом браузере на старом адресе, на новый не переносится — диагностику можно пройти заново, это 5 минут.</p>
  </div>
</main>
</body>
</html>
